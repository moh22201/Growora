];
const heroes=[
{id:1,name:'الحارس الحديدي',role:'دفاع',icon:'🛡️',unlock:1,ability:'درع القلعة: يقلل خسارة الموارد عند الدفاع.',base:900},
{id:2,name:'فارس الصاعقة',role:'هجوم',icon:'⚡',unlock:3,ability:'ضربة صاعقة: فرصة ضرر هجومي إضافي.',base:1100},

{id:4,name:'سيد الحديد',role:'اقتصاد',icon:'⛏️',unlock:8,ability:'خبير الموارد: إنتاج الحديد أعلى.',base:850},
{id:5,name:'فارس الظلال',role:'مباغتة',icon:'🗡️',unlock:12,ability:'هجوم خاطف: فرصة لسرقة ذهب إضافي.',base:1250},
{id:6,name:'حارسة النور',role:'دعم',icon:'✨',unlock:16,ability:'إسناد: يرفع قوة الفريق.',base:1200},
{id:7,name:'ملك العاصفة',role:'نخبوي',icon:'🌩️',unlock:20,ability:'العاصفة: ضرر مرتفع ضد الخصوم الأقوى.',base:1450},
{id:8,name:'الإمبراطور',role:'أسطوري',icon:'👑',unlock:25,ability:'هيبة الإمبراطور: مكافأة PvP أفضل عند الفوز.',base:1700}
];

];
const base={version:4,name:'King_TheReal',avatar:'👑',castle:1,gold:1000,wheat:500,wood:500,iron:200,stars:0,pvp:1000,last:Date.now(),attackDay:'',attacks:3,attacked:{},dailyClaim:'',dailyStreak:0,missions:{upgrade:0,attack:0,win:0,collect:0},heroes:{1:{level:1,xp:0,equipment:0}},equipment:{},facilityLevels:{wheat:1,wood:1,iron:1,factory:1,heroes:1,storage:1,arena:1},factoryLevel:1,building:null,facilityUpgrade:null,shieldUntil:0,log:[],production:{wheat:{active:false,startedAt:0},wood:{active:false,startedAt:0},iron:{active:false,startedAt:0}}};
let tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null; if(tg){tg.ready();tg.expand();} let s=load();
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');return merge(JSON.parse(JSON.stringify(base)),raw||{})}catch(e){return JSON.parse(JSON.stringify(base))}}
function merge(a,b){if(!b)return a;for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')a[k]=merge(a[k],b[k]);else a[k]=b[k]}if(!a.avatar)a.avatar='👑';if(!a.facilityLevels)a.facilityLevels={wheat:1,wood:1,iron:1,factory:1,heroes:1,storage:1,arena:1};if(!a.facilityUpgrade)a.facilityUpgrade=null;const old=a.production||{};a.production={wheat:{active:false,startedAt:0},wood:{active:false,startedAt:0},iron:{active:false,startedAt:0}};for(const k of ['wheat','wood','iron']){if(old[k]&&typeof old[k]==='object'){a.production[k].active=!!old[k].active;a.production[k].startedAt=Number(old[k].startedAt)||0}else if(old[k]===true){a.production[k].active=true;a.production[k].startedAt=Date.now()}}return a}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function fmt(x){return Math.floor(Math.max(0,x)).toLocaleString('en-US')}
function fmtTime(ms){if(ms<=0)return 'جاهز';let sec=Math.ceil(ms/1000);let d=Math.floor(sec/86400);sec%=86400;let h=Math.floor(sec/3600);sec%=3600;let m=Math.floor(sec/60);sec%=60;return d?`${d}ي ${h}س`:h?`${h}س ${m}د`:m?`${m}د ${sec}ث`:`${sec}ث`}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1900)}
function dayKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function resetDay(){const d=dayKey();if(s.attackDay!==d){s.attackDay=d;s.attacks=3;s.attacked={};s.missions.attack=0;s.missions.win=0;save()}}
function cap(){return 10000*s.castle}
const PRODUCTION_MS=8*60*60*1000;
const prodBase={wheat:4800,wood:3840,iron:1920};
function productionAmount(k){const lv=Math.max(1,Math.min(30,s.facilityLevels[k]||1));return Math.round(prodBase[k]*(1+0.10*(lv-1)))}
function productionState(k){const p=s.production[k];if(!p||!p.active||!p.startedAt)return {active:false,remaining:0};return {active:true,remaining:Math.max(0,p.startedAt+PRODUCTION_MS-Date.now())}}
function accrue(){resetDay();let now=Date.now();if(s.building&&s.building.until<=now){s.castle=s.building.to;s.building=null;toast('🏰 اكتمل تطوير القلعة')}if(s.facilityUpgrade&&s.facilityUpgrade.until<=now){const k=s.facilityUpgrade.key;s.facilityLevels[k]=Math.min(30,(s.facilityLevels[k]||1)+1);s.facilityUpgrade=null;toast(`🏗️ تم تطوير ${buildingNames[k]} إلى المستوى ${s.facilityLevels[k]}`)}for(const k of ['wheat','wood','iron']){const p=s.production[k];if(p&&p.active&&p.startedAt&&now>=p.startedAt+PRODUCTION_MS){const amount=productionAmount(k);s[k]=Math.min(cap(),s[k]+amount);p.active=false;p.startedAt=0;log('✅',`اكتمل إنتاج ${buildingNames[k]}: +${fmt(amount)}`)}}s.last=now;save()}
function heroPower(id){const h=heroes.find(x=>x.id===id);const q=s.heroes[id];if(!q)return 0;return Math.round(h.base*q.level*(1+q.equipment*.18))}
function totalPower(){let p=1200*s.castle;for(const h of heroes)p+=heroPower(h.id);p+=s.factoryLevel*450;return Math.round(p)}
function selectedHeroes(){return Object.keys(s.heroes).filter(id=>s.heroes[id]&&s.heroes[id].level>0).map(Number).sort((a,b)=>heroPower(b)-heroPower(a)).slice(0,3)}
const buildingNames={castle:'القلعة',wheat:'القمح',wood:'الخشب',iron:'الحديد',factory:'مصنع المعدات',heroes:'معهد الأبطال',storage:'المخزن',arena:'الساحة'};
function renderTop(){accrue();document.getElementById('playerName').textContent=s.name;document.getElementById('playerAvatar').textContent=s.avatar||'👑';document.getElementById('castleLv').textContent=s.castle;document.getElementById('power').textContent=fmt(totalPower());for(const k of ['gold','wheat','wood','iron','stars'])document.getElementById(k).textContent=fmt(s[k]);document.getElementById('attackNav').textContent=`${s.attacks}/3`;document.querySelectorAll('[data-building]').forEach(b=>{const k=b.dataset.building;const lv=k==='castle'?s.castle:(s.facilityLevels[k]||1);const lab=b.querySelector('.building-label');if(lab)lab.textContent=`${buildingNames[k]} • المستوى ${lv}`})}
function costHtml(c){return `<div class="grid2"><div class="mini">🪙 <b>${fmt(c[0])}</b></div><div class="mini">🌾 <b>${fmt(c[1])}</b></div><div class="mini">🪵 <b>${fmt(c[2])}</b></div><div class="mini">⛓️ <b>${fmt(c[3])}</b></div></div>`}
function facilityCost(k,lv){const mult={wheat:1,wood:0.92,iron:0.82}[k]||1;const g=Math.round(500*Math.pow(1.58,lv-1)*mult);const w=Math.round(1000*Math.pow(1.52,lv-1)*(k==='wheat'?1:0.75));const wood=Math.round(700*Math.pow(1.52,lv-1)*(k==='wood'?1:0.72));const iron=Math.round(250*Math.pow(1.55,lv-1)*(k==='iron'?1:0.7));return [g,w,wood,iron]}
function enough(c){return s.gold>=c[0]&&s.wheat>=c[1]&&s.wood>=c[2]&&s.iron>=c[3]}

 const valid=opponents.filter(o=>Math.abs(o[1]-s.castle)<=0);const pool=valid.length?valid:opponents.filter(o=>o[1]<=s.castle).slice(-6);for(const o of pool.slice(0,8)){const shield=s.attacked[o[0]]||0;const attacked=shield>Date.now();const enemy=o[2]+(o[1]*350);html+=`<div class="card"><div class="target"><div class="logo">🏰</div><div><h3>${o[0]}</h3><div class="muted">قلعة ${o[1]} • ⚔️ ${fmt(enemy)} ${attacked?`• 🛡️ محمي ${fmtTime(shield-Date.now())}`:''}</div></div><button class="action smallbtn" data-target="${o[0]}" ${s.attacks<=0||attacked?'disabled':''}>هجوم</button></div></div>`}html+=`</div><div class="footnote">نطاق المطابقة: نفس مستوى القلعة. في النسخة المتصلة يمكن استبدال القائمة ببيانات لاعبين حقيقيين عبر Supabase.</div>`;

function bind(type){const p=document.getElementById('panel');const up=p.querySelector('#doUpgrade');if(up)up.onclick=()=>{const c=castleCosts[s.castle-1];if(!enough(c))return toast('الموارد غير كافية');s.gold-=c[0];s.wheat-=c[1];s.wood-=c[2];s.iron-=c[3];s.building={to:s.castle+1,until:Date.now()+c[4]*60000};s.missions.upgrade++;log('🏗️','بدأ تطوير القلعة إلى '+(s.castle+1));save();open('castle')};p.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>heroAction(+b.dataset.hero));p.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>craft(+b.dataset.craft));p.querySelectorAll('[data-production]').forEach(b=>b.onclick=()=>{const k=b.dataset.production;const ps=productionState(k);if(ps.active)return toast('هذه الدورة تعمل بالفعل');s.production[k]={active:true,startedAt:Date.now()};log('▶️',`بدأت دورة إنتاج ${buildingNames[k]} لمدة 8 ساعات`);save();open('production')});p.querySelectorAll('[data-facility-upgrade]').forEach(b=>b.onclick=()=>{const k=b.dataset.facilityUpgrade;const lv=s.facilityLevels[k]||1;if(lv>=30)return toast('وصلت المنشأة إلى المستوى 30');if(s.facilityUpgrade)return toast('هناك تطوير آخر جارٍ');const c=facilityCost(k,lv);if(!enough(c))return toast('الموارد غير كافية');s.gold-=c[0];s.wheat-=c[1];s.wood-=c[2];s.iron-=c[3];s.facilityUpgrade={key:k,until:Date.now()+60*60*1000};log('🏗️',`بدأ تطوير ${buildingNames[k]} إلى المستوى ${lv+1}`);save();open('castle')});p.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>startBattle(b.dataset.target));const saveProfile=p.querySelector('#saveProfile');if(saveProfile)saveProfile.onclick=()=>{const v=(p.querySelector('#nameInput')?.value||'').trim();if(v.length<3)return toast('الاسم يجب أن يكون 3 أحرف على الأقل');s.name=v;s.avatar=p.querySelector('.avatarPick.selected')?.dataset.avatar||s.avatar||'👑';save();renderTop();toast('تم حفظ الملف الشخصي');open('profile')};p.querySelectorAll('.avatarPick').forEach(b=>b.onclick=()=>{p.querySelectorAll('.avatarPick').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const q=p.querySelector('#profileAvatarPreview');if(q)q.textContent=b.dataset.avatar});const daily=p.querySelector('#daily');if(daily)daily.onclick=claimDaily;p.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyPack(+b.dataset.buy))}
function heroAction(id){const h=heroes.find(x=>x.id===id);if(s.castle<h.unlock)return toast('البطل غير مفتوح بعد');if(!s.heroes[id]){s.heroes[id]={level:1,xp:0,equipment:0};log('🦸','تم فتح '+h.name);save();toast('🎉 تم فتح '+h.name);open('heroes');return}const q=s.heroes[id],cost=Math.round(650*q.level*q.level);const iron=Math.round(120*q.level);if(s.gold<cost||s.iron<iron)return toast(`تحتاج 🪙 ${fmt(cost)} و ⛓️ ${fmt(iron)}`);s.gold-=cost;s.iron-=iron;q.level++;q.xp=0;log('⬆️',`تم تطوير ${h.name} إلى ${q.level}`);save();toast('تم تطوير البطل');open('heroes')}
function craft(i){const cost=[1200*(i+1),500*(i+1),300*(i+1)];if(s.gold<cost[0]||s.wood<cost[1]||s.iron<cost[2])return toast('موارد التصنيع غير كافية');s.gold-=cost[0];s.wood-=cost[1];s.iron-=cost[2];s.equipment[i]=(s.equipment[i]||0)+1;for(const id of selectedHeroes())s.heroes[id].equipment=Math.max(s.heroes[id].equipment,(s.equipment[i]||0));log('🏭','تم تصنيع قطعة معدات');s.missions.collect++;save();toast('⚔️ تم تصنيع المعدات');open('factory')}
function startBattle(name){if(s.attacks<=0)return toast('انتهت هجمات اليوم');if(s.attacked[name])return toast('لا يمكنك تكرار هذا الخصم اليوم');const o=opponents.find(x=>x[0]===name);if(!o)return;const enemy=o[2]+o[1]*350;const my=totalPower();const battle=calcBattle(my,enemy,o[1]);const back=document.getElementById('battleBack'),m=document.getElementById('battleModal');m.innerHTML=`<div class="modalHead"><div class="row"><h2>⚔️ معركة ضد ${name}</h2><button class="close" id="battleClose">إغلاق</button></div></div><div class="card center"><div class="muted">قوتك</div><div class="big">${fmt(my)}</div><div style="font-size:24px;margin:6px">VS</div><div class="muted">قوة الخصم</div><div class="big">${fmt(enemy)}</div></div><div class="card"><h3>${battle.win?'🏆 انتصار':'🛡️ دفاع ناجح للخصم'}</h3><div class="muted">${battle.text}</div><div class="grid2" style="margin-top:8px"><div class="mini">🪙 ${battle.gold>=0?'+':''}${fmt(battle.gold)}</div><div class="mini">🌾 ${battle.wheat>=0?'+':''}${fmt(battle.wheat)}</div><div class="mini">🪵 ${battle.wood>=0?'+':''}${fmt(battle.wood)}</div><div class="mini">⛓️ ${battle.iron>=0?'+':''}${fmt(battle.iron)}</div></div></div><button class="action" id="finishBattle">حفظ النتيجة</button>`;back.classList.add('show');m.querySelector('#battleClose').onclick=()=>back.classList.remove('show');m.querySelector('#finishBattle').onclick=()=>{applyBattle(name,o,battle);back.classList.remove('show');open('pvp')}}
function calcBattle(my,enemy,lv){const ratio=my/Math.max(1,enemy);const chance=Math.max(.12,Math.min(.88,.5+(Math.log(ratio)/2.8)));const win=Math.random()<chance;const raidBase=Math.max(1000,lv*2500);if(win){const gold=Math.round(raidBase*.03),wheat=Math.round(raidBase*.12),wood=Math.round(raidBase*.10),iron=Math.round(raidBase*.08);return {win,gold,wheat,wood,iron,text:'تم اختراق دفاع الخصم. حصلت على جزء محدود من الموارد والذهب القابل للنهب.'}}return {win,gold:-Math.round(raidBase*.01),wheat:0,wood:0,iron:0,text:'فشل الهجوم. لا تحصل على غنائم، مع خسارة ذهب بسيطة كتكلفة للحملة.'}}
function applyBattle(name,o,b){s.attacks--;s.attacked[name]=Date.now()+2*60*60*1000;s.missions.attack++;if(b.win){s.gold+=b.gold;s.wheat=Math.min(cap(),s.wheat+b.wheat);s.wood=Math.min(cap(),s.wood+b.wood);s.iron=Math.min(cap(),s.iron+b.iron);s.pvp+=18;if(s.heroes[8])s.gold+=Math.round(b.gold*.2);s.missions.win++;log('🏆',`انتصار على ${name}`)}else{s.gold=Math.max(0,s.gold+b.gold);s.pvp=Math.max(0,s.pvp-8);log('🛡️',`خسارة أمام ${name}`)}save();toast(b.win?'🏆 فوز!':'🛡️ خسر الهجوم')}
function claimDaily(){if(s.dailyClaim===dayKey())return;s.dailyClaim=dayKey();s.dailyStreak=Math.min(7,s.dailyStreak+1);const r=[['gold',1500],['wheat',1500],['wood',1200],['iron',800],['gold',2500],['wheat',3000]][s.dailyStreak-1]||null;if(r)s[r[0]]+=r[1];else{s.gold+=5000;s.stars+=5}log('🎁','تم استلام الهدية اليومية');save();toast('🎁 استلمت هديتك');open('missions')}
function buyPack(i){const prices=[25,25,75,150,300];const cost=prices[i];if(s.stars<cost)return toast('⭐ Stars غير كافية في النسخة التجريبية');const rewards=[()=>{s.wheat+=50000;s.wood+=40000;s.iron+=20000},()=>{if(s.building)s.building.until=Math.max(Date.now(),s.building.until-12*3600000)},()=>{s.gold+=100000;s.wheat+=30000;s.wood+=30000;s.iron+=15000},()=>{s.pvp+=10},()=>{s.gold+=250000;s.wheat+=60000;s.wood+=50000;s.iron+=25000}];s.stars-=cost;rewards[i]();log('⭐','تم شراء عنصر تجريبي من المتجر');save();toast('تم تنفيذ المشتريات التجريبية');open('shop')}
function log(t,d){s.log.push({t,d});if(s.log.length>50)s.log.shift()}

// ===== World map pan & pinch zoom =====
(function(){
  const scene=document.querySelector('.scene');
  const world=document.getElementById('world');
  const hint=document.getElementById('mapHint');
  if(!scene||!world)return;
  let scale=1, x=0, y=0, dragging=false, sx=0, sy=0, ox=0, oy=0, pinchStart=0, pinchScale=1;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function limits(){
    const sw=scene.clientWidth, sh=scene.clientHeight, ww=sw*1.5*scale, wh=(sw*1.5/1.5)*scale;
    return {x:Math.max(0,(ww-sw)/2), y:Math.max(0,(wh-sh)/2)};
  }
  function apply(){
    const l=limits(); x=clamp(x,-l.x,l.x); y=clamp(y,-l.y,l.y);
    world.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;
  }
  function zoomAt(next){
    const old=scale; scale=clamp(next,.9,2.4);
    const rect=scene.getBoundingClientRect();
    const cx=rect.width/2, cy=rect.height/2;
    const k=scale/old; x*=k; y*=k; apply();
    hint.textContent=scale>1.05?'اسحب الجزيرة • زوم مفعل':'اسحب الجزيرة للتحريك • قرّب بإصبعين للزوم';
  }
  scene.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,.top,.side,.zoomControls'))return;
    dragging=true; sx=e.clientX; sy=e.clientY; ox=x; oy=y; scene.setPointerCapture?.(e.pointerId);
  });
  scene.addEventListener('pointermove',e=>{if(!dragging)return; x=ox+(e.clientX-sx); y=oy+(e.clientY-sy); apply();});
  scene.addEventListener('pointerup',()=>dragging=false);
  scene.addEventListener('pointercancel',()=>dragging=false);
  let p1=null,p2=null;
  function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
  scene.addEventListener('touchstart',e=>{
    if(e.target.closest('button,.top,.side,.zoomControls'))return;
    if(e.touches.length===2){p1=e.touches[0];p2=e.touches[1];pinchStart=dist(p1,p2);pinchScale=scale;dragging=false;e.preventDefault();}
  },{passive:false});
  scene.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinchStart){const d=dist(e.touches[0],e.touches[1]);scale=clamp(pinchScale*(d/pinchStart),.9,2.4);apply();e.preventDefault();}
  },{passive:false});
  scene.addEventListener('touchend',e=>{if(e.touches.length<2){pinchStart=0;p1=p2=null;}},{passive:true});
  document.getElementById('zoomIn')?.addEventListener('click',()=>zoomAt(scale+.2));
  document.getElementById('zoomOut')?.addEventListener('click',()=>zoomAt(scale-.2));
document.getElementById('zoomReset')?.addEventListener('click',()=>{scale=1;x=0;y=0;apply();hint.textContent='اسحب الجزيرة للتحريك • استخدم + / − أو إصبعين للزوم';});
  apply();
})();

renderTop();setInterval(()=>{renderTop();const p=document.getElementById('panel');if(p.innerHTML&&document.visibilityState==='visible'&&p.querySelector('[data-production]'))open('production')},1000);
