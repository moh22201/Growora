<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123a53">
<title>Growora — Grow. Upgrade. Build Your Fortune.</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game-shell">
  <header class="hud">
    <div class="brand"><span class="crown">♛</span><div><b>Growora</b><small data-i18n="tagline">Grow. Upgrade. Build Your Fortune.</small></div></div>
    <div class="balances"><div class="balance"><span>🪙</span><div><small data-i18n="playBalance">Play balance</small><b id="playBalance">$10.00</b></div></div><div class="balance"><span>💰</span><div><small data-i18n="salesBalance">Sales balance</small><b id="salesBalance">$0.00</b></div></div></div>
    <div class="hud-actions"><select id="languageSelect" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option></select><button id="walletBtn" class="hud-btn">▣ <span data-i18n="wallet">Wallet</span></button><button id="settingsBtn" class="hud-btn">⚙ <span data-i18n="settings">Settings</span></button></div>
  </header>
  <main>
    <section class="world-frame" aria-label="Interactive Growora island world">
      <canvas id="world" width="1440" height="900" aria-label="Click fields, coop, beehive or fishing pond to interact"></canvas>
      <div class="player-card"><div class="avatar">🧑‍🌾</div><div class="player-data"><b>Farmer</b><small><span data-i18n="level">Level</span> 1</small><div class="xp"><i></i></div></div></div>
      <div class="world-hint" id="worldHint" data-i18n="hint">Tap a field to plant, grow or harvest</div>
      <div class="world-controls"><button data-zone="farm">🌱 <span data-i18n="farm">Farm</span></button><button data-zone="fishing">🎣 <span data-i18n="fishing">Fishing</span></button><button data-zone="hive">🐝 <span data-i18n="honey">Honey</span></button><button data-zone="coop">🥚 <span data-i18n="eggs">Eggs</span></button></div>
    </section>
    <section class="below-world"><div class="notice"><span>✦</span><div><b data-i18n="prototype">Interactive world prototype</b><p data-i18n="notice">Farm actions work locally in this browser. Deposits and withdrawals are not connected to real payments.</p></div></div><button id="marketBtn" class="market-btn">🧺 <span data-i18n="market">Market</span> <span id="inventoryCount" class="count">0</span></button></section>
  </main>
</div>
<div id="modalLayer" class="modal-layer" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button id="closeModal" class="close" aria-label="Close">×</button><div id="modalIcon" class="modal-icon">🌱</div><h2 id="modalTitle">Field</h2><p id="modalText"></p><div id="modalChoices" class="modal-choices"></div></section></div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
