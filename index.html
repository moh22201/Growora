<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#123a53">
<title>Growora — Grow. Upgrade. Build Your Fortune.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game-shell">
  <main class="world-stage" id="worldStage" aria-label="Growora game world">
    <img class="world-image" src="growora-island.png" alt="Growora island game world">
    <div class="top-hud">
      <div class="brand"><span class="crown">♛</span><div><b>Growora</b><small>Grow. Upgrade. Build Your Fortune.</small></div></div>
      <div class="balances">
        <div class="balance"><span>🪙</span><div><small data-i18n="playBalance">Play balance</small><b id="playBalance">$10.00</b></div></div>
        <div class="balance"><span>💰</span><div><small data-i18n="salesBalance">Sales balance</small><b id="salesBalance">$0.00</b></div></div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="walletBtn"><span>👛</span><small data-i18n="wallet">Wallet</small></button>
        <button class="icon-button" id="storageBtn"><span>🎒</span><small data-i18n="storage">Storage</small></button>
        <button class="icon-button" id="settingsBtn"><span>⚙️</span><small data-i18n="settings">Settings</small></button>
        <button class="icon-button" id="supportBtn"><span>✉️</span><small data-i18n="support">Support</small></button>
        <select id="languageSelect" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option></select>
      </div>
    </div>
    <div class="player-card"><div class="avatar">🧑‍🌾</div><div><b>Farmer</b><small><span data-i18n="level">Level</span> 1</small><div class="xp"><i></i></div></div></div>
    <nav class="side-nav" aria-label="Game systems">
      <button data-zone="farm"><span>🌱</span><small data-i18n="farm">Farming</small></button>
      <button data-zone="fishing"><span>🎣</span><small data-i18n="fishing">Fishing</small></button>
      <button data-zone="hive"><span>🐝</span><small data-i18n="honey">Honey</small></button>
      <button data-zone="coop"><span>🥚</span><small data-i18n="eggs">Eggs</small></button>
    </nav>
    <button class="hotspot fields-hotspot" id="fieldsHotspot" aria-label="Open fields"></button>
    <button class="hotspot coop-hotspot" data-zone="coop" aria-label="Open chicken coop"></button>
    <button class="hotspot hive-hotspot" data-zone="hive" aria-label="Open beehive"></button>
    <button class="hotspot fishing-hotspot" data-zone="fishing" aria-label="Open fishing area"></button>
    <button class="hotspot market-hotspot" id="marketBtn" aria-label="Open market"><span>🧺 <span data-i18n="market">Market</span> <b id="inventoryCount">0</b></span></button>
    <div class="bottom-nav">
      <button id="inventoryBtn"><span>🎒</span><small data-i18n="myStorage">My storage</small></button>
      <button data-zone="farm"><span>🏡</span><small data-i18n="farm">Farm</small></button>
      <button data-zone="fishing"><span>🎣</span><small data-i18n="fishing">Fishing</small></button>
      <button data-zone="hive"><span>🍯</span><small data-i18n="honey">Honey</small></button>
      <button data-zone="coop"><span>🥚</span><small data-i18n="eggs">Eggs</small></button>
    </div>
    <div class="hint" id="hint" data-i18n="hint">Tap a field to plant, grow or harvest</div>
  </main>
</div>
<div id="modalLayer" class="modal-layer" hidden>
 <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <button id="closeModal" class="close" aria-label="Close">×</button>
  <div id="modalIcon" class="modal-icon">🌱</div><h2 id="modalTitle">Growora</h2><p id="modalText"></p>
  <div id="modalContent"></div><div id="modalChoices" class="modal-choices"></div>
 </section>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
